# Multi-agent profile: shared memory with namespace grants (source authority R2).
extends: base
profile: multi_agent

# Server profile: durable background execution through Temporal, with an
# embedded Resonate step journal local to this deployment.
workers:
  runner: temporal
  temporal:
    deployment_id: multi-agent

memories:
  shared:
    enabled: true      # needs >=1 of semantic|episodic (C1b); base enables both
  working:
    enabled: true

# Secure defaults (#45): agents share memory here, so the trust-horizon gate,
# write-door redaction and the untrusted-data wrapper are on. A record below
# trust 0.5 (tool/web input, or another agent's record seen through a grant)
# reaches a context window inside a nonce-closed UNTRUSTED NOTE wrapper.
integrity:
  enabled: true
  untrusted_wrap_below: 0.5

firewall:
  redact_secrets: true
  pii: redact
