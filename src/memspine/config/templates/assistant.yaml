# Conversational-assistant profile: long multi-session chat memory.
#
# Since ADR-033 the measured read-path advantages (combo-A: replay reads, relative
# dates resolved, time order for ordering questions, relative floor, relevance-first
# scoring, no access recording, the dated answer prompt) live in `base`, so every
# template has them. `assistant` names that configuration for chat workloads and is
# the default for Engine() with no template (ADR-032). Reranking stays opt-in.
extends: base
profile: assistant
