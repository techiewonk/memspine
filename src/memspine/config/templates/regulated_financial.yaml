# Regulated profile: full audit trail is non-negotiable — event_log.mode is
# pinned to full, PII handling strict, services hard-fail (D-10).
extends: base
profile: regulated_financial
strict_services: true

event_log:
  mode: full           # never rolling/ephemeral here: audit + rebuild required
  compress: true       # compression is fine; deletion is not

# Server profile: durability is non-negotiable here, so background pipelines
# run through Temporal with an embedded Resonate step journal.
workers:
  runner: temporal
  temporal:
    deployment_id: regulated-financial

memories:
  semantic:
    enabled: true
    policies:
      pii_default_tier: regulated

# Secure defaults (#45): trust-horizon gate, write-door redaction of secrets and
# PII (phone, card, SSN, IBAN, IP), and the untrusted-data wrapper are on.
integrity:
  enabled: true
  untrusted_wrap_below: 0.5

firewall:
  redact_secrets: true
  pii: redact
