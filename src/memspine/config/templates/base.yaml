# memspine base template: the "simple" working brain, with the measured read-path
# advantages on by default (ADR-033). Every other template extends this one (D-12).
#
# The read settings below are combo-A from the paid LoCoMo ablations (cats 1-4,
# 1,540 q, Qwen3-32B reader and judge; paper_spine/evaluation/LOCOMO_RESULTS_*):
# 70.7% -> 78.3% (+/- 0.26, 3 runs) at the same ~1.6K-token context. All rules, no
# extra model calls. The bare configuration is the `core` template.
profile: simple
strict_services: true

event_log:
  mode: full          # append-only source of truth (D0.1); see D-45 for rolling/ephemeral
  compress: false

storage:             # ADR-081: one slot per data category (records, vector, lexical, graph, cache)
  records:
    provider: sqlite
    settings:
      path: ./memspine.db
      busy_timeout_s: 5.0

runtime:
  provider_services:
    health_timeout_s: 5.0
    close_timeout_s: 10.0
    startup_timeout_s: null
  service_switches:
    projections:
      mode: controlled

read:
  default_mode: replay          # combo-A read path (auto's compose routing measured -2.1)
  record_access: false          # a read must not boost recency for the next question
  resolve_relative_dates: true  # H1: "last Friday" -> [= 2023-05-12]  (+5.8 alone)
  order_by_time_for_ordering: true  # H16: first/latest/before -> time order
  temporal_leg: true            # F2/W4b: event-time leg (LoCoMo coverage +1.7, 28 gained / 2 lost; ADR-062)
  scoring:                      # relevance-first: recency/importance demoted the best
    recency_weight: 0.0         # match on stored transcripts
    importance_weight: 0.0
    utility_weight: 0.0
  assembly:
    relative_floor: 0.3         # H4: drop candidates far below the best
  # candidate_pool: 3           # rerank a wider pool (with model.rerank below) ...

model:                          # ADR-082: one slot per model category
  rerank:
    chain: []                   # reranking is opt-in per requirement; to enable, e.g.:
    # chain:
    #   - {provider: onnx, settings: {}}   # local cross-encoder (or flashrank | qwen3 | litellm)
    # keep: 10                  # ... then keep the best 10

prompts:
  selection:
    chat:
      condition: dated          # H12: chat@dated answer prompt (+3.2 alone)

memories:
  working:
    enabled: true
  episodic:
    enabled: true
  semantic:
    enabled: true
    policies:
      conflict:
        # A less-trusted same-key write CONTESTs the current fact instead of
        # superseding or retracting it (closes the supersession availability vector,
        # edge_cells.md). Offline check 2026-10-05: no QA change on LoCoMo combo-A.
        contest_lower_trust: true
