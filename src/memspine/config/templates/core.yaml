# memspine core template: the bare configuration (the pre-ADR-033 "base").
# No read-path enhancements: auto read mode, composite scoring with recency,
# access recording, the base chat prompt. Used by the test suite and by the
# eval harness's reference arms so published results stay reproducible.
profile: core
strict_services: true

event_log:
  mode: full          # append-only source of truth (D0.1); see D-45 for rolling/ephemeral
  compress: false

storage:
  records:
    provider: sqlite
    settings:
      path: ./memspine.db
      busy_timeout_s: 5.0

runtime:
  provider_services:
    health_timeout_s: 5.0
    close_timeout_s: 10.0
    startup_timeout_s: null
  service_switches:
    projections:
      mode: controlled

memories:
  working:
    enabled: true
  episodic:
    enabled: true
  semantic:
    enabled: true

model:
  llm: {}                # no role is bound; selected adapters supply native generation defaults
