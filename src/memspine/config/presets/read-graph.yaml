# FU-REQS profile: read-core plus compiled edges, the graph / entity / episode legs and the
# session-close episodes they read. Question: do compiled edges and episodes help multi-hop and
# temporal questions? Reference: S02. Replaces S13, S30-S33, S39. Needs a bound session_close role.
read:
  family_fusion: true
  lift_before_rerank: true
  exact_budget: true
  contract_rules: true
  router_rules: true
  tiers: true
  entity_leg: true
  graph_leg: true
  episode_leg: true
model:
  rerank:
    chain:             # R3-07 licence fallback chain (Jina v3.5, Qwen3-Reranker-0.6B, MiniLM CPU)
      - {provider: jina, settings: {}}
      - {provider: qwen3, settings: {}}
      - {provider: onnx, settings: {}}
graph:
  edge_compiler: true
offline:
  session_close: true
memories:
  semantic:
    enabled: true
  associative:
    enabled: true
