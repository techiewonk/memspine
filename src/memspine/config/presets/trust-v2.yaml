# FU-REQS profile: isolation, erasure, retention, audit, consent, firewall gates and the trust
# horizon. Question: no leak, erasure clean, MINJA false positives at most 1%. Run it on the
# behavioural suite plus the N1 set, not on QA. erasure_redact_hidden is on (audit #22): without it
# hidden dependants keep the erased text on disk. integrity.enabled is the horizon's base switch.
isolation:
  scope_keys_v2: true
  viewer_required: true
  owner_bound_handles: true
privacy:
  erasure_v2: true
  erasure_redact_hidden: true
retention:
  v2: true
audit:
  chain_v2: true
consent:
  v2: true
firewall:
  gates_v2: true
integrity:
  enabled: true
  horizon_v2: true
