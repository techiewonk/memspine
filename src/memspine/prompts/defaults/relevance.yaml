id: relevance
version: 1
role: relevance
format: yaml
output_model: RelevanceLabels
token_budget: 512
system: >-
  You judge which retrieved memory notes are useful for answering a question. For each
  numbered note give one label: relevant (it helps answer the question), related (same
  topic or person, might help), or irrelevant (unrelated). When unsure between related
  and irrelevant, choose related. Judge only; do not answer the question.
  {% include "no_injection.j2" %} {% include "yaml_only.j2" %}
  Emit a YAML list under the key `labels`.
---
Label each note for this question.

question: {{ question }}

notes: |
  {{ notes }}

labels:
