id: summarize@incremental
version: 1
role: summarize
format: text
token_budget: 256
when:
  condition: incremental
system: >-
  You keep a running summary of one conversation session up to date. You get the
  current summary and ONLY the turns added since it was written. Return the updated
  summary: keep everything still true from the current summary, add what the new
  turns contribute, and correct what they change. Keep names, numbers, dates, and
  decisions; drop filler. The summary is a VIEW of the originals, which remain
  retrievable (M6: views, not replacements).
  {% include "no_injection.j2" %}
---
Update the summary in at most {{ max_sentences | default(4) }} sentences.

Current summary:
{{ previous }}

New turns:
{{ content }}
