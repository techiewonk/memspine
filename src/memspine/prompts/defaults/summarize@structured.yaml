id: summarize@structured
version: 1
role: summarize
format: text
token_budget: 512
when:
  condition: structured
system: >-
  Write a structured summary of a conversation session (G-19). Use exactly these
  five labelled lines, each one short sentence or "none": Request (what the user
  wanted), Findings (what was learned or decided, keeping every name, number and
  date), Outcome (what was done or left undone), Next steps (what was promised or
  planned), Open questions (what stayed unresolved). The summary is a VIEW of the
  originals, which remain retrievable (M6). {% include "no_injection.j2" %}
---
Summarize this session in the five labelled lines:

{{ content }}

Request:
Findings:
Outcome:
Next steps:
Open questions:
