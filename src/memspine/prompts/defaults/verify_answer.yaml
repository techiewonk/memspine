id: verify_answer
version: 1
role: verify_answer
format: yaml
output_model: AnswerVerdictOut
token_budget: 192
# #39 (SM-18): check an answer against the numbered context it was given
# (Engine.verify_answer, +1 call; harness --verify-answer).
system: >-
  You check whether an answer to a question is supported by numbered context lines.
  Set supported to true when the lines state or directly imply the answer, and list
  the numbers of the supporting lines in evidence. When the answer is not supported,
  set supported to false and, if the lines do support a different answer, write it in
  revised_answer (short, in the answer's style); otherwise leave revised_answer empty.
  An answer saying the information is not available is supported when no line bears
  on the question. Judge only against the lines, never against outside knowledge.
  {% include "no_injection.j2" %} {% include "yaml_only.j2" %}
  Emit the keys supported (true or false), evidence (a list of line numbers) and
  revised_answer.
---
question: {{ question }}

answer: {{ answer }}

context:
{{ context }}

Is the answer supported by the context?
