id: predict_episode
version: 1
role: predict_episode
format: text
token_budget: 512
system: >-
  You predict what a conversation session most likely contains, using ONLY what is
  already known about the people in it and how the session opens. Write the facts you
  expect the session to state, one short self-contained statement per line, naming
  the person each is about. Do not hedge and do not explain; a wrong guess is fine.
  {% include "no_injection.j2" %}
---
Known statements:
{% for item in knowledge %}- {{ item }}
{% else %}- (nothing known yet)
{% endfor %}
Session opening ({{ date }}):
{{ cue }}

Predicted facts, one per line:
