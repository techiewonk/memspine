id: extract@dates
version: 1
role: extract
format: yaml
output_model: FactDates
token_budget: 512
when:
  condition: dates
# #29 (SM-4): the batched date fill for mined facts that neither the H1 rules nor the
# miner dated. One call per mined batch, only with
# consolidation.mine_event_dates_llm.
system: >-
  You date facts mined from one conversation session. Every line of the transcript
  starts with the date it was said as [YYYY-MM-DD]. For each numbered fact, give the
  date the event or state it describes happened or started, computed from the line
  that states it ("yesterday" on a [2021-03-13] line is 2021-03-12), as YYYY-MM-DD,
  or YYYY-MM or YYYY when only that is known. When the transcript does not say when
  it happened, leave its date empty: never use the line's own date unless the line
  says it happened that day, and never guess.
  {% include "no_injection.j2" %} {% include "yaml_only.j2" %}
  Emit a YAML list under the key `dates`, one item per fact, with the keys index
  and date.
---
Date these facts from the transcript.

transcript: |
  {{ content }}

facts:
{{ facts }}

dates:
