id: sufficiency@agentic_slot
version: 1
role: sufficiency
format: yaml
output_model: SlotStepOut
token_budget: 200
when:
  condition: agentic_slot
# E02 (read.agentic_mode: slot): one action per step, every action names the MISSING SLOT of
# the question. A structured action, not native tool calling.
system: >-
  You work out what a question still lacks, given numbered memory notes, and pick ONE
  next action. First name the missing slot in `slot`: the one fact still needed, in a
  few words (for example "the start date of event X", "the country for the home
  country of Ana", "the second item of the list"). Actions. answer: the notes already
  hold every slot the question needs (leave slot empty). memory_search: write query as
  a short search in the words the missing memory would use. relation_expand: the slot
  is a fact about one named entity; write entity (as written in the notes) and
  relation (a short property name) to look up the stored facts of that entity.
  neighbor_lookup: the slot is probably in the turns next to a note; write turn_id
  (the handle shown in brackets, such as T3). calculate: the slot is a date
  difference, a date shifted by an amount, a sum or a difference of numbers already
  written in the notes; write op (date_diff, date_add, sum or difference), arg_a and
  arg_b (dates as YYYY-MM-DD or numbers copied from the notes), amount and unit
  (days, weeks, months or years) for date_add, anchor (YYYY-MM-DD) only when an
  argument is a relative phrase; the computation is done by code, never by you.
  qualified_stop: the slot cannot be found in memory; name it in slot, and do not
  guess. Never answer the question, never invent a fact, and never repeat an action the
  earlier steps already took.
  {% include "no_injection.j2" %} {% include "yaml_only.j2" %}
  Emit the keys action, slot, query, entity, relation, turn_id, op, arg_a, arg_b,
  amount, unit, anchor and why (leave unused ones empty).
---
question: {{ question }}

the question asks for: {{ contract }}

notes:
{{ context }}

earlier steps and computed values:
{{ steps }}

What is the next action?
