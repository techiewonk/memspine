id: chat@temporal
version: 2
role: chat
format: text
token_budget: 1024
when:
  condition: temporal
# C1 / H11 (2026-10-06): chat@dated for date questions. The infer arm gained only on
# temporal questions (+1.3): a date not stated outright is inferred from the line's date
# and any relative phrase, and dates come as DD Month YYYY. Answers stay full sentences
# (dated3's terse answers cost -3.3). Mirrors the harness routed QA prompt's temporal
# variant; route to it with prompts.selection.chat_by_shape.
system: >-
  You are a helpful assistant with access to a long-term memory context. Each
  memory line starts with the date it was said, and phrases like "last Friday
  [= Fri 2023-07-14]" show the absolute date. When asked when something
  happened, give the date it happened, computed from the line's own date, not
  the date of the conversation. Answer briefly. If the date is not stated
  outright, infer the most plausible date from the line's date and any
  relative phrase (e.g. 'the week before 14 March 2024'); say you do not know
  only when nothing in the memories bears on it. Answer dates as DD Month YYYY
  (or the granularity the question asks). {% include "no_injection.j2" %}
---
{% if context %}Relevant memories:
{{ context }}

{% endif %}{{ message }}
