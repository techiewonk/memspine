[project]
name = "memspine"
version = "0.0.1"
description = "A cognitive memory engine for AI agents — one clean API, composable stores, real learning dynamics."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "techiewonk" }]
keywords = ["memory", "agents", "llm", "rag", "knowledge-graph", "vector-search"]

# Slim core (D-03): a working brain with zero heavy deps.
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.5",         # storage: Core, not ORM (D-36)
    "alembic>=1.20.0",           # migrations (D-36)
    "orjson>=3.13.0",            # hot-path serialization (D-38)
    "xxhash>=4.0.1",             # content fingerprints (D-37)
    "fastuuid>=0.14.0",          # fast record ids (D-37)
    "structlog>=26.1.0",         # structured logging (D-04/M11)
    "typer>=0.27.3",             # CLI (D-04)
    "onnxruntime>=1.24.3",       # pinned-catalogue CPU inference (ADR-084)
    "tokenizers>=0.23.3",        # native tokenizer matching catalogue exports
    "huggingface-hub>=1.33.0,<3", # standard model cache; Hub 2.x retry follows ADR-085
    "json-repair>=0.64.0",       # always-on JSON safety net (D-31)
    "datasketch>=2.0.0",         # MinHash-LSH dedup stage-1 (D-27)
    "zstandard>=0.25.0",         # cold-tier compression (D-32)
    "jinja2>=3.1.6",             # prompt templating (D-43)
    "aiosqlite>=0.22.1",         # async SQLite driver for SQLAlchemy (D-44)
    "greenlet>=3.5.6",           # required by SQLAlchemy async engine (D-44)
    "pyyaml>=6.0.3",             # config layering / templates / prompt packs (D-11/D-12/D-43)
    "httpx>=0.28.1",             # clients/http: OpenAI-compatible local LLM surface (D-39/D-46)
    "lancedb>=0.40.0",           # sole vector store + native quantization (D-09, amends D-03 — ADR-021)
    "tantivy>=0.26.2",           # default lexical/BM25 leg — standalone, backend-independent (D-25, amends D-03; hybrid is default-on since A3)
    "dishka>=1.10.1,<2",         # dependency injection: app / job / request scopes (F-08, ARCHITECTURE section 8)
]

[project.optional-dependencies]
anyllm = ["any-llm-sdk>=1.40.1,<2"]  # ADR-085; install provider SDK extras separately
# NOTE(ADR-034): ladybug (the maintained, MIT-licensed Kùzu fork; Kùzu itself was
# archived on 2025-10-10) is the graph engine for graph features. Pinned to one
# minor: the embedded storage format and Cypher surface move between minors.
# ``graph.provider`` still defaults to sql_adjacency (D-03 slim core).
graph      = ["ladybug>=0.21.2,<0.22"]                 # embedded Cypher graph engine (D-26, ADR-034)
cache      = ["cashews[redis,diskcache]>=7.6.0"]       # unified disk + redis/valkey cache (D-09, ADR-022)
ingest     = ["markitdown>=0.1.8", "chonkie>=1.7.0"]    # multi-format ingest + chunking (D-29)
ner        = ["gliner2[local]>=2.1.0,<3"]  # local NER; explicit [local] inference stack, transformers<6
decider    = ["torch>=2.14.1", "transformers>=5.20.1", "safetensors>=0.8.0", "huggingface-hub>=2.2.0,<3"]  # I28: OpenDecider-nano inference (own port, no `opendecider` package); ~0.8 GB weights, CPU ok
community  = ["graspologic-native>=1.3.1,<1.4"]        # graph community detection — Rust Leiden, MIT (D-40, ADR-043; needs numpy+scipy, no numpy ceiling)
compress   = ["llmlingua>=0.2.2"]                     # assembly-time context compression (E5)
llmlocal   = ["llama-cpp-python>=0.3.36"]              # in-proc open-weight inference (D-39)
opensearch = ["opensearch-py[async]>=3.2.0,<4"]       # async server-scale lexical/BM25 leg; embedded default is core tantivy
temporal   = ["temporalio>=1.34.0,<2", "resonate-sdk>=0.8.1,<0.9"]  # external macro-orchestration + embedded micro-orchestration
taskiq     = ["taskiq>=0.13.0", "taskiq-redis>=1.2.4"]  # brokered worker runner (D-16)
rest       = ["fastapi>=0.143.3", "uvicorn>=0.54.0"]    # REST protocol (D-06)
otel       = ["opentelemetry-api>=1.45.1", "opentelemetry-sdk>=1.45.1"]  # optional span export (G-20, T5-06): ids/counts only, no content
rerank     = ["flashrank>=0.2.10"]                      # E8 cross-encoder rerank alt (D-51)
st         = ["transformers>=5.20.1", "torch>=2.14.1", "sentence-transformers>=6.1.0", "bitsandbytes>=0.50.2"]   # local torch rerankers: Qwen3-Reranker (G5a)
static     = ["model2vec>=0.10.0"]                      # E4 static-embedding prefilter (ADR-020)
aws        = ["boto3>=1.43.114"]                         # Bedrock LLM/embeddings + Secrets (D-07/D-22)
promptopt  = ["langmem>=0.0.30"]                     # RG-only prompt self-optimization hook (D-43)
postgres   = ["psycopg[binary]>=3.3.6", "pgvector>=0.5.1"]  # storage backend (D-36, psycopg3: sync Alembic + async runtime)
weaviate   = ["weaviate-client>=4.23.1,<5"]
neo4j      = ["neo4j>=6.4.1"]
mongodb    = ["pymongo>=4.13,<5"]                       # RM-112 records store: native asyncio API (Motor is deprecated); needs a replica set
# #52/ADR-035: SQLCipher encryption at rest for the SQLite event log + read model
# (``storage.encryption.mode: sqlcipher``). A native build on some platforms, so it
# is NOT in ``all``; ``pysqlcipher3`` is accepted too if already installed.
encrypt    = ["sqlcipher3>=0.6.4"]

# Convenience bundles
local      = ["memspine[graph,cache,ingest,ner]"]
prod-aws   = ["memspine[aws,taskiq,rest]"]
# `community` (graspologic-native) declares no numpy ceiling (ADR-028/035), so it does not conflict
# with `ingest` (numpy>=2.1) and is included in `all` — `--all-extras` is unblocked.
all        = ["memspine[graph,cache,ingest,ner,community,compress,llmlocal,opensearch,temporal,taskiq,rest,rerank,static,aws,postgres,weaviate,neo4j,mongodb]"]

dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "import-linter>=2.15",       # X-02: scripts/ci_importlinter.py (layer contracts in .importlinter)
    "fakeredis>=2.40.0",          # mock cache/broker in tests (D-41)
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.7",
    "tzdata; sys_platform == 'win32'",  # zoneinfo has no system tz database on Windows (tests use Europe/Berlin)
]

[project.scripts]
memspine = "memspine.cli:app"

[project.urls]
Homepage = "https://github.com/techiewonk/memspine"
Repository = "https://github.com/techiewonk/memspine"
Documentation = "https://github.com/techiewonk/memspine/tree/main/docs"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260906",
    "packaging>=26.3",        # dependency metadata audit (development tooling only)
    # api/rest is dev-tested in-process (httpx ASGITransport, no server);
    # taskiq stays OUT of dev — its runner is tested via fakeredis + pure fns (D-41).
    "fastapi>=0.143.3",
]
[tool.uv]
required-version = ">=0.13.1"  # current lockfile format and Python 3.13 tooling

[tool.hatch.build.targets.wheel]
packages = ["src/memspine"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Markdown is prose: ruff >=0.17 would otherwise reformat python code fences in docs/README.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# CI-GREEN lint policy: the formatter owns code wrapping at line-length 100; E501 only ever fires on
# what the formatter cannot wrap (long string literals, prompts, comments, URLs), so it is not enforced.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests, eval harness, one-off analysis scripts and docs tooling are not the shipped engine: keep the
# correctness rules (F, I, E4/E7 syntax-level, B006...) but waive stylistic/idiom rules there.
# src/ keeps the full rule set.
"{tests,evals,docs,scripts}/**" = [
    "RUF001", "RUF005", "RUF012", "RUF015", "RUF028", "RUF043", "RUF046", "RUF059",
    "RUF007", "B007", "B905", "E402", "E731", "E741", "F841",
    "SIM102", "SIM105", "SIM108", "SIM115", "SIM117",
    "ASYNC221", "ASYNC240", "UP042", "UP046",
]
# The kernel benchmark defines and calls rank() inside one loop iteration (no stale capture).
"evals/bench/cpu_evidence_budget_kernels.py" = ["B023"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["evals"]  # H6: evals/*.py scripts (run_chunked, ...) importable whichever conftest wins
addopts = "-q"
markers = [
    "shipped_default: run with the shipped Engine() default template (ADR-032), not the pinned pre-ADR default",
    "milestone: phase-exit milestone runs (docs/v2/MILESTONES.md), model-free",
    "provider_live: real provider startup, health, operation and owned-resource shutdown contract",
]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src/memspine"]

[[tool.mypy.overrides]]
module = [
    "fastuuid",
    "datasketch",
    "datasketch.*",
    "gliner2",
    "gliner2.*",
    "json_repair",
    # optional extras — typed only when installed
    "lancedb",
    "lancedb.*",
    "kuzu",
    "kuzu.*",
    "ladybug",
    "ladybug.*",
    "pyarrow",
    "pyarrow.*",
    "llama_cpp",
    "llama_cpp.*",
    "resonate",
    "resonate.*",
    "temporalio",
    "temporalio.*",
    "markitdown",
    "markitdown.*",
    "chonkie",
    "chonkie.*",
    "graspologic_native",
    "graspologic_native.*",
    "taskiq",
    "taskiq.*",
    "taskiq_redis",
    "taskiq_redis.*",
    "redis",
    "redis.*",
    "cashews",
    "cashews.*",
    "diskcache",
    "diskcache.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "psycopg",
    "psycopg.*",
    "flashrank",
    "flashrank.*",
    "llmlingua",
    "llmlingua.*",
    "model2vec",
    "model2vec.*",
    "tantivy",
    "tantivy.*",
    # heavy optional deps not installed in the dev-only CI env (imported lazily)
    "sentence_transformers",
    "sentence_transformers.*",
    "transformers",
    "transformers.*",
    "torch",
    "torch.*",
    "safetensors",
    "safetensors.*",
    "psutil",
    "onnxruntime",
    "onnxruntime.*",
]
ignore_missing_imports = true

# The optional Workflow decorator is Any when [temporal] is absent. Function
# bodies remain strict; the orchestration CI job checks with the real SDK too.
[[tool.mypy.overrides]]
module = ["memspine.workers.temporal_workflow"]
disallow_untyped_decorators = false
