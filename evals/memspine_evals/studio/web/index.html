<title>MemSpine Tuning Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header with mode badge; left stage rail (select on phones) beside a tabbed workbench. Utilitarian tool UI. */
:root{
  --bg:#edf0f2; --surface:#ffffff; --surface2:#f3f6f8; --line:#d3dbe1; --fg:#16212a; --muted:#54636f;
  --accent:#0b6e78; --accent-ink:#ffffff; --accent-soft:#d8eef0;
  --ok:#17794a; --ok-soft:#dcf1e5; --bad:#b3261e; --bad-soft:#f8dedb; --warn:#8a5a00; --warn-soft:#f8ebc9;
  --font-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151b; --surface:#151f28; --surface2:#1b2833; --line:#2b3a47; --fg:#e3eaef; --muted:#92a3b1;
  --accent:#4cc3cf; --accent-ink:#04252a; --accent-soft:#12383d;
  --ok:#4cc58a; --ok-soft:#12301f; --bad:#ff8a80; --bad-soft:#3b1b19; --warn:#e5b64a; --warn-soft:#382a0c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151b; --surface:#151f28; --surface2:#1b2833; --line:#2b3a47; --fg:#e3eaef; --muted:#92a3b1;
  --accent:#4cc3cf; --accent-ink:#04252a; --accent-soft:#12383d;
  --ok:#4cc58a; --ok-soft:#12301f; --bad:#ff8a80; --bad-soft:#3b1b19; --warn:#e5b64a; --warn-soft:#382a0c; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);padding-inline:16px;padding-block:0}
.wrap{max-width:1560px;margin-inline:auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.05rem} h3{font-size:.92rem}
code,.mono,pre{font-family:var(--font-mono);font-size:.82rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td,th{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;border-bottom:1px solid var(--line)}
.top h1{font-size:1.2rem}
.top .sp{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.badge{font:700 .72rem var(--font-display);letter-spacing:.08em;padding:3px 9px;border-radius:3px;text-transform:uppercase;border:1px solid transparent}
.badge.live{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.badge.demo{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.badge.boot{background:var(--surface2);color:var(--muted);border-color:var(--line)}
.chip{font:.78rem var(--font-mono);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--fg);font-weight:500}
.banner{margin-block:10px;padding:9px 12px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--fg);border-radius:var(--r);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.banner.ok{border-color:var(--ok);background:var(--ok-soft)}
.banner.bad{border-color:var(--bad);background:var(--bad-soft)}
.banner .grow{flex:1;min-width:14rem}
.banner small{display:block;color:var(--muted)}

.shell{display:grid;grid-template-columns:19.5rem minmax(0,1fr);gap:16px;align-items:start;padding-bottom:40px}
#rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.2rem);max-height:calc(100dvh - 5.4rem);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
#rail header{position:sticky;top:0;background:var(--surface);padding:10px;border-bottom:1px solid var(--line);display:grid;gap:6px;z-index:1}
#rail details>summary{cursor:pointer;padding:7px 10px;background:var(--surface2);font:600 .78rem var(--font-display);letter-spacing:.08em;text-transform:uppercase;display:flex;justify-content:space-between;border-block:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;display:grid;grid-template-columns:3.1rem minmax(0,1fr) auto 1.4rem;gap:6px;align-items:center;width:100%;padding:5px 10px;cursor:pointer;border-left:3px solid transparent;font-size:.86rem}
.row:hover{background:var(--surface2)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.row .rid{font:500 .78rem var(--font-mono)}
.row.sub .rid{padding-left:.7rem;color:var(--muted)}
.row .rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rk{text-align:right;color:var(--muted);font:.76rem var(--font-mono)}
.stagepick{display:none}

.pill{font:600 .7rem var(--font-mono);padding:1px 6px;border-radius:3px;border:1px solid var(--line);background:var(--surface2);color:var(--muted);white-space:nowrap;display:inline-block}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok)}
.pill.bad{color:var(--bad);background:var(--bad-soft);border-color:var(--bad)}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn)}
.pill.acc{color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}

main{min-width:0}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:12px}
.tabs button{all:unset;box-sizing:border-box;padding:8px 14px;cursor:pointer;font:600 .86rem var(--font-display);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.panel{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.card>h2,.card>h3{margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:10px 14px}
.field{display:grid;gap:3px;min-width:0}
.field label,.lbl{font:600 .72rem var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field small{color:var(--muted)}
input[type=text],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 8px;min-width:0;width:100%}
textarea{font-family:var(--font-mono);font-size:.82rem;min-height:5.5rem;resize:vertical}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:2px 8px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{color:var(--muted);font-size:.85rem}
.slot{min-width:0}
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th{font:600 .7rem var(--font-display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;background:var(--surface2);white-space:nowrap}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.mono,.mono{font-family:var(--font-mono);font-size:.8rem}
td input,td select{min-width:6rem}
.kv{display:grid;grid-template-columns:minmax(7rem,max-content) minmax(0,1fr);gap:3px 14px;margin:0}
.kv dt{color:var(--muted);font:.8rem var(--font-mono)} .kv dd{margin:0;overflow-wrap:anywhere}
pre.raw{margin:6px 0 0;padding:8px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;overflow:auto;max-height:22rem;white-space:pre-wrap;overflow-wrap:anywhere}
details.d>summary{cursor:pointer;color:var(--muted);font-size:.84rem;padding-block:3px}
.err{border:1px solid var(--bad);background:var(--bad-soft);border-radius:var(--r);padding:9px 12px;display:grid;gap:5px}
.err b{color:var(--bad)}
.busy{color:var(--muted);display:flex;gap:8px;align-items:center}
.spin{width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none;border-top-color:var(--line);background:var(--accent-soft)}*{scroll-behavior:auto!important;transition:none!important}}

.strip{display:flex;flex-wrap:wrap;gap:4px}
.step{all:unset;box-sizing:border-box;cursor:pointer;font:500 .74rem var(--font-mono);padding:2px 7px;border-radius:3px;border:1px solid var(--line);background:var(--surface2);color:var(--muted)}
.step.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)}
.step.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-soft)}
.step:focus-visible{outline:2px solid var(--accent)}
.turn{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;gap:5px;background:var(--surface)}
.turn .t{overflow-wrap:anywhere}

.qres{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.qres>summary{cursor:pointer;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.qres>div{padding:0 12px 12px;display:grid;gap:12px}
.frow{display:grid;grid-template-columns:5.2rem minmax(6rem,1fr) 8.5rem;gap:8px;align-items:center;font-size:.84rem}
.frow .track{height:14px;background:var(--surface2);border-radius:2px;position:relative;overflow:hidden}
.frow .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);opacity:.85}
.frow .drop{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px);opacity:.55}
.gsq{display:inline-flex;gap:2px;vertical-align:middle;margin-right:5px}
.gsq i{width:10px;height:10px;border:1.5px solid var(--ok);display:block;border-radius:2px}
.gsq i.on{background:var(--ok)} .gsq i.off{border-color:var(--bad)}
.wf{display:grid;gap:4px;font-size:.84rem}
.wf>div:not(.frow):not(.lbl){display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.tchip{font:.74rem var(--font-mono);padding:1px 5px;border-radius:3px;border:1px solid var(--line);background:var(--surface2)}
.tchip.gold-lost{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.tchip.gold-kept{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--surface)}
.verdict.pass{border-color:var(--ok);background:var(--ok-soft)} .verdict.fail{border-color:var(--bad);background:var(--bad-soft)}
.verdict .big{font:700 1.5rem var(--font-display)}
.verdict.pass .big{color:var(--ok)} .verdict.fail .big{color:var(--bad)}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{border:1px solid var(--line);border-radius:var(--r);padding:6px 14px;background:var(--surface);min-width:6rem}
.tile b{display:block;font:700 1.4rem var(--font-display)} .tile span{color:var(--muted);font-size:.78rem}
.msgrow{display:grid;grid-template-columns:8rem minmax(10rem,1fr) 9rem 6rem auto;gap:6px;align-items:end}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)} #rail{display:none}
  .stagepick{display:grid;gap:3px;margin-bottom:10px}
  .msgrow{grid-template-columns:1fr 1fr} .msgrow .wide{grid-column:1/-1}
}
.scrim{position:fixed;inset:0;background:rgba(8,14,19,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;max-width:34rem;width:100%;padding:16px;display:grid;gap:10px;max-height:90dvh;overflow:auto}
</style>

<div class="wrap">
  <header class="top">
    <h1>MemSpine Tuning Studio</h1>
    <span id="mode-badge" class="badge boot" role="status">Checking</span>
    <div id="hchips" class="chips" aria-label="Session summary"></div>
    <span class="sp"></span>
    <button id="btn-connect" class="btn primary sm" type="button" hidden>Connect local engine</button>
  </header>
  <div id="banner" class="banner" role="status"></div>
  <details class="d" id="approvals" style="margin-bottom:10px"><summary>Calls the desktop app may ask you to approve</summary><div id="approvals-body" class="tablebox" style="margin-top:6px"></div></details>

  <div class="shell">
    <aside id="rail" aria-label="Stage map">
      <header>
        <label class="lbl" for="rail-filter">Stage map</label>
        <input id="rail-filter" type="text" placeholder="Filter by id or name, e.g. C20 or rerank" autocomplete="off">
        <span id="rail-note" class="hint"></span>
      </header>
      <div id="rail-body"></div>
    </aside>
    <main>
      <div class="stagepick"><label class="lbl" for="stage-select">Stage</label><select id="stage-select"></select></div>
      <div class="tabs" role="tablist" aria-label="Studio sections" id="tabs"></div>
      <div id="panels"></div>
    </main>
  </div>
</div>

<div id="confirm" class="scrim" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="cf-title">
    <h2 id="cf-title"></h2>
    <div id="cf-body"></div>
    <div class="bar" style="justify-content:flex-end">
      <button id="cf-cancel" class="btn" type="button">Cancel</button>
      <button id="cf-ok" class="btn primary" type="button">Confirm</button>
    </div>
  </div>
</div>
