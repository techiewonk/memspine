# P0-08 / G-02 D: the v2 benchmark suite. Read by evals/suite/suite.py, validated against
# memspine_evals.datasets.registry. LongMemEval is excluded by owner decision and is refused by the loader.
version: 1
excluded:
  - longmemeval
entries:
  - id: locomo
    dataset: locomo
    role: dev
    categories: [1, 2, 3, 4, 5]          # category 5 (adversarial) is in scope
    slice: analysis/locomo_split.json     # dev / held-out split by conversation (v1 hashes kept)
    metric: accuracy
    judge: qwen3-32b-binary
    pass_rule: paired gate (paired_gate.decide) on the dev slice, no category beyond its band
  - id: op_bench
    dataset: op_bench
    role: dev
    slice: analysis/opbench_persona_split.json   # dev 331 / held-out 528, split by persona
    metric: accuracy
    judge: qwen3-32b-binary
    pass_rule: paired gate on the dev slice
  - id: mab_cr
    dataset: memoryagentbench
    role: blind
    slice: analysis/blind_split_mab.json         # sealed hash split, scored once per frozen candidate
    metric: accuracy
    judge: contains
    pass_rule: sealed one-shot (seal.py) then paired gate; net not below -band
  - id: convomem
    dataset: convomem
    role: blind
    slice: analysis/blind_split_convomem.json
    metric: accuracy
    judge: qwen3-32b-binary
    pass_rule: sealed one-shot then paired gate; net not below -band
  - id: prefeval
    dataset: prefeval
    role: blind
    slice: "rule:sha256(persona_id) split sealed at freeze (file analysis/blind_split_prefeval.json to be created)"
    metric: preference_following_rate
    judge: qwen3-32b-binary
    pass_rule: sealed one-shot then paired gate; net not below -band
  - id: behavioural
    dataset: null                                 # dataset-free: synthetic conversations, invented names
    role: behavioural
    slice: "rule:evals/memspine_evals/behavioural_cases.py"
    metric: case_status
    judge: none
    pass_rule: no case that PASSes on the reference arm may FAIL on the arm; NOT_SUPPORTED listed, never blocks
