# Configuration example only: replace the local endpoint/model names before use.
# Validation does not download weights or contact these endpoints.
# Timeouts and output limits illustrate the contract; size them for your prompts.
deployment:
  id: local-multi-model
runtime:
  provider_services:
    health_timeout_s: 5.0
    close_timeout_s: 10.0
    startup_timeout_s: null
models:
  profiles:
    fast:
      kind: llm
      provider: litellm
      settings:
        model: openai/local-fast
        api_base: http://localhost:8000/v1
        timeout_seconds: 5.0
        temperature: 0.0
        max_tokens: 256
    reasoning:
      kind: llm
      provider: litellm
      settings:
        model: openai/local-reasoning
        api_base: http://localhost:8001/v1
        timeout_seconds: 8.0
        temperature: 0.1
        max_tokens: 512
    entities:
      kind: gliner
      provider: gliner2
      settings:
        model: fastino/gliner2.5-base-v1
        device: cpu
        local_files_only: true
        tasks: [entities]
        inference_concurrency: 1
    classifier:
      kind: gliner
      provider: gliner2
      settings:
        model: fastino/GLiNER2.5-Decide
        device: cpu
        local_files_only: true
        tasks: [classification]
        inference_concurrency: 1
  bindings:
    window_extract: fast
    chat: fast
    judge: reasoning
    verify_answer: reasoning
    gliner_decision: classifier
    gliner_semantic: entities
    gliner_prepass: entities
  gliner_max_models: 2
  escalation:
    window_extract:
      targets: [reasoning]
      triggers: [error, invalid_json, empty]
      max_attempts: 2
      timeout_s: 10.0
      max_tokens_per_attempt: 256
# Bindings select models; they do not enable write/prepass/memory features.
# Enable those features separately after validating their intended behavior.
